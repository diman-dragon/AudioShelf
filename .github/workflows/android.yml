name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Права по умолчанию только на чтение: запись нужна лишь задаче release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 требует Node 22+ и Java 21.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Browser tests (npm test)
        run: npm test

      - name: Java unit tests
        run: npm run sync && cd android && chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.apk.outputs.version }}
      file: ${{ steps.apk.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Постоянный ключ подписи лежит в секретах (см. store/PUBLISHING.md). Без секретов (чужой форк) подпись обычная debug.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AUDIOSHELF_DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUDIOSHELF_DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUDIOSHELF_DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUDIOSHELF_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/audioshelf-debug.jks"
            {
              echo "AUDIOSHELF_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/audioshelf-debug.jks"
              echo "AUDIOSHELF_DEBUG_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "AUDIOSHELF_DEBUG_KEY_ALIAS=$KEY_ALIAS"
              echo "AUDIOSHELF_DEBUG_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Секреты ключа подписи не заданы: APK подписан временным debug-ключом и не встанет поверх APK с вашим ключом."
          fi

      - run: npm ci
      - run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        id: apk
        run: bash .github/scripts/name-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AudioShelf-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # только здесь: публикация релиза
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AudioShelf-${{ needs.build.outputs.version }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          FILE: ${{ needs.build.outputs.file }}
        run: bash .github/scripts/publish-release.sh
