def keyProps = new Properties()
def keyFile = rootProject.file('keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
def secret = { String name -> System.getenv(name) ?: keyProps.getProperty(name) }

android {
    signingConfigs {
        if (secret('AUDIOSHELF_DEBUG_KEYSTORE_FILE')) {
            audioshelf {
                storeFile file(secret('AUDIOSHELF_DEBUG_KEYSTORE_FILE'))
                storePassword secret('AUDIOSHELF_DEBUG_KEYSTORE_PASSWORD')
                keyAlias secret('AUDIOSHELF_DEBUG_KEY_ALIAS')
                keyPassword secret('AUDIOSHELF_DEBUG_KEY_PASSWORD')
            }
        }
        if (secret('AUDIOSHELF_KEYSTORE_FILE')) {
            release {
                storeFile file(secret('AUDIOSHELF_KEYSTORE_FILE'))
                storePassword secret('AUDIOSHELF_KEYSTORE_PASSWORD')
                keyAlias secret('AUDIOSHELF_KEY_ALIAS')
                keyPassword secret('AUDIOSHELF_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (secret('AUDIOSHELF_DEBUG_KEYSTORE_FILE')) signingConfig signingConfigs.audioshelf
        }
        release {
            if (secret('AUDIOSHELF_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
}
