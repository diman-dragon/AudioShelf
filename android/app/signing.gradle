// Debug-сборка всегда подписывается одним и тем же ключом из репозитория (debug.keystore).
// Со случайным debug-ключом, который на каждой сборке в CI новый, Android не ставил бы
// APK поверх старого. Это ключ для личной установки, а не для магазина:
// стандартные debug-данные (android / androiddebugkey).
android {
    signingConfigs {
        audioshelf {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.audioshelf
        }
    }
}
