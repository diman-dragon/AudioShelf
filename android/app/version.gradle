// Версия приложения берётся из package.json — единственного источника.
// Пример: версия 0.4.0 -> versionName "0.4.0", versionCode = major*10000 + minor*100 + patch = 400.
// versionCode растёт вместе с версией, поэтому новый APK ставится поверх старого.
import groovy.json.JsonSlurper

def pkg = new JsonSlurper().parse(file('../../package.json'))
def (major, minor, patch) = pkg.version.tokenize('.').collect { it.toInteger() }

ext.appVersionName = pkg.version
ext.appVersionCode = major * 10000 + minor * 100 + patch
